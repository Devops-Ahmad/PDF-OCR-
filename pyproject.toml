[project]
name = "bookocr"
version = "0.1.0"
description = "Standalone, portable OCR tool: turns a scanned book PDF into a high-fidelity, page-preserved book.txt and book.md. No dependency on any downstream project."
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "click>=8.1",
    "rich>=13.0",
    "structlog>=24.1",
    # PINNED, do not upgrade blindly: paddlepaddle==3.3.1 crashes on CPU
    # inference with `NotImplementedError: ConvertPirAttribute2RuntimeAttribute
    # not support [pir::ArrayAttribute<pir::DoubleAttribute>]` whenever oneDNN
    # is enabled (the default), on every text-detection model tested
    # (PP-OCRv5_server_det and PP-OCRv5_mobile_det). This is a PIR/oneDNN
    # regression in paddlepaddle itself, not a paddleocr issue. 3.1.0 is the
    # newest version confirmed NOT to hit it during Phase 0 benchmarking
    # (2026-09-23). Re-test this pin before ever bumping it.
    "paddlepaddle==3.1.0",
    "paddleocr>=3.7",
    # Layout/reading-order detection. Pulls in torch (CUDA build, several GB
    # download the first time -- see README setup notes) and needs a local
    # llama-server binary for its inference backend; run
    # scripts/setup_layout_backend.sh once after installing this.
    "surya-ocr>=0.22",
    # Pass 2 escalation engine (QARI-OCR, a Qwen2-VL-2B fine-tune). Shares
    # the torch install surya already pulled in.
    "transformers>=4.49",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.0",
    "bitsandbytes>=0.50",
]

[project.scripts]
ocr = "bookocr.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookocr"]

[dependency-groups]
dev = ["pytest>=8.0"]
