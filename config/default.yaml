# Default configuration for bookocr.
# Override with a project-specific YAML passed via --config, or individual
# --set key=value flags on the CLI (deep-merged over this file).
#
# There is deliberately no source/output path configured here: bookocr is a
# portable tool invoked as `ocr convert <path-to.pdf> [--output DIR]` against
# an arbitrary file, not a library manager for a fixed directory tree.

rasterize:
  dpi: 300
  image_format: "png"

triage:
  blank_page_ink_ratio_threshold: 0.002   # below this fraction of non-white pixels -> BLANK
  orientation_check: true                  # use Tesseract OSD if available; skip silently if not installed

preprocess:
  # Every step below is conditional: it only runs if the page's own analysis
  # says it's needed. Nothing is applied blindly to every page.
  deskew:
    enabled: true
    min_angle_deg: 0.3
  denoise:
    enabled: true
    noise_score_threshold: 0.15
  binarize:
    enabled: true
    method: "sauvola"          # sauvola | otsu
    low_contrast_threshold: 40  # std-dev of grayscale histogram below which we binarize
  upscale:
    enabled: true
    min_effective_dpi: 200

layout:
  engine: "none"               # none | surya  (surya integration lands in a later phase)

ocr:
  primary_engine: "paddleocr"
  primary:
    lang: "ar"
    text_detection_model_name: "PP-OCRv5_server_det"
    text_recognition_model_name: "arabic_PP-OCRv5_mobile_rec"
    device: "cpu"               # no working GPU wheel for this paddlepaddle/CUDA combo yet; see docs/hardware_notes.md
  escalation:
    enabled: false              # Pass 2: QARI-OCR local VLM tier, not wired up yet
    engine: "qari-ocr"
  cloud_fallback:
    enabled: false              # Pass 3: opt-in only, never on by default
    provider: "gemini"
    api_key_env: "GEMINI_API_KEY"

quality:
  # Weighted 0-100 page confidence score. Thresholds decide tier routing.
  weights:
    engine_confidence: 0.5
    arabic_char_ratio: 0.2
    dictionary_hit_rate: 0.15
    length_anomaly: 0.1
    garbage_symbol_ratio: 0.05
  thresholds:
    high: 80
    medium: 60
    # below "medium" -> LOW_CONFIDENCE, triggers escalation when enabled

watermark_filter:
  enabled: true
  # A line is treated as a non-content watermark/scan-artifact only if BOTH
  # hold: it sits in the bottom band of the page (by bounding-box position)
  # AND it recurs, near-identically, across a large share of the book's
  # pages. Position alone or repetition alone is not enough -- a repeated
  # short line of real dialogue must not be filtered.
  bottom_band_fraction: 0.15
  min_page_occurrences: 3
  min_page_fraction: 0.3

concurrency:
  cpu_workers: 6                # leave headroom on a 12-thread machine
  gpu_stage_batch_size: 4

output:
  internal_dirname: ".ocr_internal"   # per-page JSONL, state db, logs -- not a product output
  txt_page_marker: "===== PAGE {page} ====="
  md_page_heading: "## Page {page}"

logging:
  level: "INFO"
